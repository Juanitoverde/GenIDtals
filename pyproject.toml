[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genidtals"
dynamic = ["version"]
description = "Anatomical biometric authentication SDK: enrollment, verification, liveness and encrypted templates"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["biometrics", "authentication", "identity-verification", "liveness", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "cryptography>=44",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27", "ruff>=0.5"]

[project.scripts]
genidtals = "genidtals.cli:main"

[tool.setuptools]
packages = ["genidtals", "genidtals.features"]

[tool.setuptools.dynamic]
version = { attr = "genidtals._version.__version__" }

[tool.setuptools.package-data]
genidtals = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"genidtals/synthetic.py" = ["S311"]
